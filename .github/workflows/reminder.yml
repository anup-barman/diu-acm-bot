name: Contest Reminder Check

on:
  schedule:
    # Run every 30 minutes (GitHub Actions cron)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-contests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Reminder Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: "Asia/Dhaka"
          REMINDER_HOURS_BEFORE: "24.0"
          DISABLE_WEB_PAGE_PREVIEW: "true"
        run: |
          python main.py --check

      - name: Commit and Push Notified Contests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notified_contests.json || true
          if git diff --staged --quiet; then
            echo "No changes in notified contests."
          else
            git commit -m "chore: update notified contests [skip ci]"
            git push
          fi
